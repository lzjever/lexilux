[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lexilux"
dynamic = ["version"]
description = "Unified LLM API client library with Chat, Embedding, Rerank, and Tokenizer support"
readme = "README.md"
requires-python = ">=3.9,<3.15"
license = {text = "Apache-2.0"}
authors = [
    {name = "Lexilux Team"}
]
keywords = ["llm", "api", "chat", "embedding", "rerank", "tokenizer", "openai-compatible"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "requests>=2.28.0",
    "httpx>=0.24.0",
    "typing_extensions>=4.0.0",
]

[project.optional-dependencies]
tokenizer = [
    "transformers>=4.30.0",
    "tokenizers>=0.13.0",
    "huggingface-hub>=0.16.0",
]

dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-mock>=3.10.0",
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "ruff>=0.1.0",
    "mypy>=0.991",
]
docs = [
    "sphinx>=5.0.0,<9.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "furo>=2024.1.0",
    "sphinx-autodoc-typehints>=1.19.0",
    "sphinx-copybutton>=0.5.0",
    "sphinx-design>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-mock>=3.10.0",
    "responses>=0.23.0",
    "ruff>=0.1.0",
    "mypy>=0.991",
    "build>=0.10.0",
    "pre-commit>=3.0.0",
]
docs = [
    "sphinx>=5.0.0,<9.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "furo>=2024.1.0",
    "sphinx-autodoc-typehints>=1.19.0",
    "sphinx-copybutton>=0.5.0",
    "sphinx-design>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/lzjever/lexilux"
Documentation = "https://lexilux.readthedocs.io"
Repository = "https://github.com/lzjever/lexilux"
Issues = "https://github.com/lzjever/lexilux/issues"

[tool.setuptools.packages.find]
exclude = [
    "tests*",
    "examples*",
    "docs*",
    "*.tests*",
]

[tool.setuptools.dynamic]
version = {attr = "lexilux.__version__"}

[tool.setuptools.package-data]
lexilux = ["py.typed", "data/*.json"]

[tool.pytest.ini_options]
addopts = [
    "--cov=lexilux",
    "--cov-report=html", 
    "--cov-report=term",
    "--cov-report=term-missing",
    "--cov-fail-under=68",
    "-v",
    "--strict-markers",
    "--tb=short",
    "-m not integration",
    "--asyncio-mode=auto"
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests (require external services)",
    "slow: Slow running tests", 
    "mock: Tests that require mocking",
    "asyncio: Async tests"
]
