# Pre-commit hooks for Lexilux
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
        files: ^(lexilux|tests|examples)/.*\.py$

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
        files: ^(lexilux|tests|examples)/.*\.py$

      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: trailing-whitespace-fixer
        language: system
        types: [text]

      - id: end-of-file-fixer
        name: fix end of files
        entry: end-of-file-fixer
        language: system
        types: [text]

      - id: check-yaml
        name: check YAML syntax
        entry: uv run python -m yamlfmt
        language: system
        files: \.(yaml|yml)$
        args: [--check]

